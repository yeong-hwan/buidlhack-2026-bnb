[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC}"
bsc_mainnet = "${BSC_MAINNET_RPC}"
opbnb_testnet = "${OPBNB_TESTNET_RPC}"
anvil = "http://127.0.0.1:8545"

[fuzz]
runs = 64

[invariant]
runs = 16
